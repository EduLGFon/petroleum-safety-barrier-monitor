# Barrier Monitor compose stack - Docker runtime for the integration.
# This is why it exists: one `compose up` runs Postgres (db) + the dashboard
# (app) plus the live Fracttal poll loop (poller) against that same DB, with
# the same image and the same boot path as local runs. Secrets live in the
# host-side `.env` (mounted read-only, never baked into the image).
#
# Fresh host (Linux, macOS, Windows with Docker Desktop + WSL2 backend):
#   cp .env.example .env        # defaults already point host->localhost, containers->db
#   docker compose up -d --build # starts db first (health-gated), then app/poller/alerts
#   docker compose run --rm tools deno run -A scripts/migrate.ts
#   docker compose run --rm tools deno run -A scripts/seed.ts  # optional demo rows
#   curl -s localhost:8000/api/health
# External/prod DB instead of the bundled `db` service: set
# DATABASE_URL_DOCKER in .env to the real URL and optionally
# `docker compose up -d app poller alerts` (or remove `db` + depends_on).
name: barrier-monitor

services:
  # Local Postgres (Windows-friendly default, also works on Linux/macOS).
  # This is why it exists: Windows has no reliable local Postgres setup for
  # this stack (native install = service/permission friction, WSL2 Postgres
  # = data loss on distro moves), so one `compose up` provides the DB with
  # zero host install. Named volume `pgdata` is intentional: bind-mounting
  # PGDATA on Docker Desktop for Windows hits file-permission and fsync
  # performance issues; a named volume stays inside the Linux VM and is fast.
  # Credentials come from POSTGRES_* in .env (defaults below are dev-only).
  # Host runs (`deno task db:migrate` on Windows) reach it via
  # localhost:${POSTGRES_PORT:-5432}; containers reach it via hostname `db`
  # (see DATABASE_URL_DOCKER below).
  db:
    image: postgres:16-alpine
    # No env_file: only POSTGRES_* (interpolated below from host .env) are
    # passed in. Mounting the full .env would leak DATABASE_URL/FRACTTAL_*
    # into the DB container for no benefit.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barreiras}
      POSTGRES_USER: ${POSTGRES_USER:-barrier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barrier}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-barrier} -d $${POSTGRES_DB:-barreiras}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Dashboard + API (Fresh production bundle, reads the mounted .env).
  app:
    build: .
    image: barrier-monitor:latest
    env_file: [.env]
    # Inside containers `localhost` means the container itself, never the
    # `db` service above - so the container URL must use hostname `db`.
    # `environment` wins over `env_file`, so this overrides the host-side
    # DATABASE_URL (which points at localhost) only inside the stack.
    # External/prod DB: set DATABASE_URL_DOCKER in .env to the real URL.
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgres://barrier:barrier@db:5432/barreiras?sslmode=disable}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env:ro
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: [
        "CMD",
        "deno",
        "eval",
        "const r = await fetch('http://localhost:8000/api/health'); if (!r.ok) Deno.exit(1);",
      ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Live Fracttal poll loop (env-driven scopes/cadence, same image).
  # Needs FRACTTAL_KEY/FRACTTAL_SECRET + FRACTTAL_SYNC_SCOPES in .env;
  # without credentials it exits(2) and the restart policy retries.
  # stop_grace_period covers a full sweep (fetch + row-by-row apply can run
  # minutes): without it Docker SIGKILLs 10s after SIGTERM mid-sweep and the
  # next startRun reaps the orphan as a noisy `reaped:` failed row.
  # Deploy drain: stop -t 180 poller when no fresh `running` row exists.
  poller:
    image: barrier-monitor:latest
    command: ["run", "-A", "scripts/fracttal-poll.ts"]
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgres://barrier:barrier@db:5432/barreiras?sslmode=disable}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env:ro
    restart: unless-stopped
    stop_grace_period: 3m

  # Scheduled alert digest (detect -> enqueue -> mail, same wiring as the
  # alerts:check --apply one-shot). Needs DATABASE_URL + OPS_SMTP_* in .env;
  # without a relay it dry-runs (detect + report only). Cadence via
  # ALERTS_POLL_SECONDS (default 900). Grace period lets an in-flight digest
  # finish sending before SIGKILL.
  alerts:
    image: barrier-monitor:latest
    command: ["run", "-A", "scripts/alerts-poll.ts"]
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgres://barrier:barrier@db:5432/barreiras?sslmode=disable}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env:ro
    restart: unless-stopped
    stop_grace_period: 1m

  # One-off toolbox (migrate, seed, import, sync, alerts). Never started by
  # `compose up`; invoked explicitly, e.g.:
  #   docker compose run --rm tools deno run -A scripts/migrate.ts
  #   docker compose run --rm -v /srv/dump:/dump tools \
  #     deno run -A scripts/fracttal-import.ts --dir /dump --apply
  # Note: do NOT add --env-file=.env here. It would re-read the host
  # DATABASE_URL (localhost) inside the container, where it must be hostname
  # `db` - the compose-provided DATABASE_URL above is already correct.
  # The `build: .` below shares the prod image with `app`, so `run tools`
  # works even on hosts that only ever built the `:dev` tag (the dev
  # override does not touch this service, so without `build` Docker would
  # try to pull `barrier-monitor:latest` from a registry and fail).
  tools:
    build: .
    image: barrier-monitor:latest
    profiles: ["tools"]
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgres://barrier:barrier@db:5432/barreiras?sslmode=disable}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env:ro

volumes:
  # Named volume (not a bind mount): required for Postgres on Docker Desktop
  # for Windows (permissions + fsync performance). Lives inside the Docker
  # Linux VM; manage with `docker volume ls/inspect` and
  # `docker compose down -v` (deletes all DB data).
  pgdata:
