# Barrier Monitor dev override - live sources, no rebuild per edit.
# This is why it exists: the prod image bakes sources + the Fresh bundle at
# build time, so every edit costs `compose build` + recreate. This file keeps
# prod `compose.yml` untouched and instead bind-mounts the tree over /app:
# the dashboard runs vite HMR, the loops restart via `deno --watch`.
# Anonymous volumes keep image-installed deps (/app/node_modules) and build
# output (/app/_fresh) intact; the named volume keeps the Deno cache warm.
#
# Usage:
#   docker compose -f compose.yml -f compose.dev.yml up --build
#   (or `deno task docker:dev`; dashboard at http://localhost:8300)
# Env still comes from the host .env via env_file (same as prod); `dev`
# reads process env, so no --env-file flag is needed inside the container.

services:
  # Schema migration runs before anything queries the DB. The dev stack
  # reuses the named `pgdata` volume, so a schema change (new SQL functions,
  # triggers, columns) would otherwise leave the app/poller querying a stale
  # database until someone remembered `docker:dev-down -v` or `db:migrate`.
  # db/schema.sql is idempotent, so applying it on every dev boot is safe.
  migrate:
    image: barrier-monitor:dev
    command: ["run", "-A", "scripts/migrate.ts"]
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgres://barrier:barrier@db:5432/barreiras?sslmode=disable}
      DENO_DIR: /deno-dir
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/_fresh
      - deno-dir:/deno-dir
    restart: "no"

  # Dashboard via vite HMR (port 8300, listens on 0.0.0.0 in Docker).
  app:
    # Own tag: dev builds `target: base` (no bundle), so sharing prod's
    # `barrier-monitor:latest` would clobber the production image on every
    # `up --build`. Poller/alerts below reuse this same dev image.
    image: barrier-monitor:dev
    build:
      context: .
      # Deps only, no `deno task build`: dev bind-mounts `./:/app` and runs
      # `task dev` (vite HMR), so the prod bundle would be built (~20s) and
      # then hidden by the mount. Prod (`compose.yml` alone) still builds
      # the default `prod` stage with the bundle baked in.
      target: base
    command: ["task", "dev", "--host", "--port", "8300"]
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/_fresh
      - deno-dir:/deno-dir
    environment:
      DENO_DIR: /deno-dir
      DEV: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8300:8300"
    healthcheck:
      disable: true

  # Live poll loop, restarted on every watched-file change (scripts + lib).
  # Same dev image as app (base stage + bind-mounted sources, no bundle).
  poller:
    image: barrier-monitor:dev
    command: ["run", "--watch", "-A", "scripts/fracttal-poll.ts"]
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/_fresh
      - deno-dir:/deno-dir
    environment:
      DENO_DIR: /deno-dir
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Alert digest loop, same watch treatment as the poller.
  alerts:
    image: barrier-monitor:dev
    command: ["run", "--watch", "-A", "scripts/alerts-poll.ts"]
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/_fresh
      - deno-dir:/deno-dir
    environment:
      DENO_DIR: /deno-dir
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  deno-dir:
